return `<svg width="0" height="0" style="position:absolute"><defs><symbol id="sk" viewBox="0 0 120 220"><rect x="68" y="-6" width="9" height="96" rx="4.5" transform="rotate(12 72 42)" fill="#fff"/><path d="M20 80h80l-10 120q-1 12-13 12H43q-12 0-13-12z" fill="#fff" fill-opacity=".38"/><path d="M24 102h72l-7 98q-1 8-12 8H43q-11 0-12-8z" style="fill:var(--a)"/><path d="M30 112q10 16 4 38M62 110q8 18 3 44M88 112q-6 14-2 30" style="stroke:var(--b)" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="60" cy="80" rx="42" ry="9" fill="#fff"/><circle cx="40" cy="64" r="19" fill="#fff"/><circle cx="72" cy="56" r="22" fill="#fff"/><circle cx="96" cy="68" r="14" fill="#fff"/><circle cx="58" cy="34" r="9" style="fill:var(--t)"/><path d="M58 27q5-12 14-13" stroke="#3E8E5A" stroke-width="3" fill="none" stroke-linecap="round"/></symbol></defs></svg>`+SH.map(([a,b,t,c])=>`<svg class="sk ${c}" style="--a:${a};--b:${b};--t:${t}" viewBox="0 0 120 220"><use href="#sk"/></svg>`).join('')}
function shell(){
$('#app').innerHTML=`<header class="hero"><div class="bg" aria-hidden="true">${bgHTML()}</div><div class="hero-in"><img class="logo" src="${S.logo}" alt="Logo ${esc(S.name)}" width="340" height="340"><h1>${esc(S.name)}</h1><p>${esc(S.tagline)}</p><div class="acts"><span class="pill">${esc(S.hours)}</span><a class="cta" href="#menu">Ver cardápio</a></div></div></header>

<main id="menu"></main>
<footer><span>${esc(S.name)} · Pedidos pelo WhatsApp</span></footer>`;

const chips=()=>(S.items.some(i=>i.ps&&i.on)?'<a href="#shakes">Milk shakes</a>':'')+(S.acai&&S.acai.on?'<a href="#acai">Açaí</a>':'')+S.cats.map((c,i)=>S.items.some(x=>x.c===c&&x.on&&!x.ps)?`<a href="#c${i}">${esc(c)}</a>`:'').join('');
const thumb=i=>i.img?`<img src="${i.img}" alt="">`:esc(i.e);
const acaiQty=()=>Object.keys(cart).filter(k=>k.startsWith('ac|')).reduce((a,k)=>a+cart[k],0);
const optCount=()=>Object.keys(cart).filter(k=>k.startsWith('cg|')).length;
const maxOpt=()=>acaiQty()*(parseInt(S.acai.max)||6);
function fitOpts(){const ks=Object.keys(cart).filter(k=>k.startsWith('cg|')),n=ks.length-maxOpt();if(n>0){ks.slice(-n).forEach(k=>delete cart[k]);toast('Opções ajustadas ao limite do pedido.')}}
function acaiSec(){const A=S.acai;if(!A||!A.on)return '';const row=(k,t,pr)=>`<div class="fl"><div class="t"><b>${esc(t)}</b><span class="pr">${pr>0?money(pr):'Grátis'}</span></div>${cart[k]?(k.startsWith('cg|')?`<button class="add sm on" data-act="dec" data-id="${k}" aria-label="Remover ${esc(t)}">✓</button>`:stepper(k,t)):`<button class="add sm${k.startsWith('cg|')&&optCount()>=maxOpt()?' dis':''}" data-act="inc" data-id="${k}" aria-label="Adicionar ${esc(t)}">+</button>`}</div>`;return `<section id="acai" class="acai"><h2>${esc(A.title)}</h2><p class="hint">${esc(A.desc)}</p><div class="cols two"><div class="col"><div class="colh"><b>Açaí</b><span>Escolha o tamanho</span></div>${A.sizes.map((z,i)=>row('ac|'+i,'Açaí '+z.n,+z.p)).join('')}</div><div class="col"><div class="colh"><b>Turbine seu açaí</b><span>${acaiQty()?`Escolhidas ${optCount()} de ${maxOpt()}`:'Escolha o açaí primeiro'} · até ${parseInt(A.max)||6} por açaí</span></div>${(A.groups||[]).map((g,gi)=>{const L=g.items.map((c,i)=>c.on===false?'':row('cg|'+gi+'|'+i,c.n,+c.p)).join('');return L?`<div class="sub">${esc(g.n)}</div>${L}`:''}).join('')||'<p class="empty">Sem opções no momento.</p>'}</div></div></section>`}
const stepper=(k,lbl)=>`<div class="step"><button data-act="dec" data-id="${k}" aria-label="Remover ${esc(lbl)}">−</button><span>${cart[k]}</span><button data-act="inc" data-id="${k}" aria-label="Adicionar ${esc(lbl)}">+</button></div>`;
function flav(i,si){const k=i.id+'|'+si,lbl=i.n+' '+S.sizes[si].n;return `<div class="fl"><span class="th">${thumb(i)}</span><div class="t"><b>${esc(i.n)}</b>${i.d?`<small>${esc(i.d)}</small>`:''}<span class="pr">${money(i.ps[si])}</span></div>${cart[k]?stepper(k,lbl):`<button class="add sm" data-act="inc" data-id="${k}" aria-label="Adicionar ${esc(lbl)}">+</button>`}</div>`}
function menu(){
const sh=S.items.filter(i=>i.ps&&i.on);let h='';
if(sh.length){const cs=S.cats.filter(c=>sh.some(i=>i.c===c));
h+=`<section id="shakes"><h2>Milk shakes</h2><p class="hint">Escolha o tamanho e o sabor.</p><div class="cols">${S.sizes.map((z,si)=>`<div class="col"><div class="colh"><b>${esc(z.n)}</b><span>a partir de ${money(Math.min(...sh.map(i=>+i.ps[si]||0)))}</span></div>${cs.map(c=>`<div class="sub">${esc(c)}</div>${sh.filter(i=>i.c===c).map(i=>flav(i,si)).join('')}`).join('')}</div>`).join('')}</div></section>`}
h+=acaiSec();
S.cats.forEach((c,ci)=>{const L=S.items.filter(i=>i.c===c&&i.on&&!i.ps);if(L.length)h+=`<section id="c${ci}"><h2>${esc(c)}</h2><div class="grid">${L.map((i,k)=>`<article class="card"><div class="dot" style="--c:${COL[k%5]}">${thumb(i)}</div><div class="t"><h3>${esc(i.n)}</h3><div class="d">${esc(i.d)}</div><div class="pr">${money(i.p)}</div></div>${cart[i.id]?stepper(i.id,i.n):`<button class="add" data-act="inc" data-id="${i.id}">Adicionar</button>`}</article>`).join('')}</div></section>`});
$('#menu').innerHTML=h||'<p class="empty">O cardápio está vazio. Adicione produtos em Editar loja.</p>'}

function bar(){
let b=$('#bar');if(!b){b=document.createElement('div');b.id='bar';$('#layer').prepend(b)}
b.innerHTML=count()?`<button data-act="cart"><span>Ver pedido · ${count()} ${count()>1?'itens':'item'}</span><span>${money(sub())}</span></button>`:'';
let e=$('#edit');if(isOwner&&!e){e=document.createElement('button');e.id='edit';e.dataset.act='admin';e.textContent='✎ Editar loja';$('#layer').appendChild(e)}}

function shade(html){let s=$('#shade');if(!s){s=document.createElement('div');s.id='shade';s.className='shade';$('#layer').appendChild(s)}s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`}
function closeSheet(){sheet=null;$('#shade')?.remove();document.body.style.overflow=''}

document.body.style.overflow='hidden';
shade(`<div class="top"><h2>Seu pedido</h2><button class="x" data-act="close" aria-label="Fechar">✕</button></div>
${count()?`<div class="box">${cartItems().map(e=>`<div class="line"><div>${esc(e.name)}<br><small>${money(e.pr)}</small></div><div class="step"><button data-act="dec" data-id="${e.k}" aria-label="Menos">−</button><span>${cart[e.k]}</span><button data-act="inc" data-id="${e.k}" aria-label="Mais">+</button></div></div>`).join('')}</div>
<div class="box"><div class="seg"><button data-act="type" data-v="entrega" class="${F.type==='entrega'?'on':''}">Entrega</button><button data-act="type" data-v="retirada" class="${F.type==='retirada'?'on':''}">Retirada</button></div>
<label for="f-name">Seu nome</label><input id="f-name" data-f="name" value="${esc(F.name)}" autocomplete="name">

${F.type==='entrega'?`<fieldset class="addr"><legend>Endereço de entrega</legend><label for="f-rua">Rua ou avenida</label><input id="f-rua" data-f="rua" value="${esc(F.rua)}" autocomplete="address-line1" placeholder="Ex.: Rua das Flores"><div class="row2"><div><label for="f-num">Nº da casa</label><input id="f-num" data-f="num" value="${esc(F.num)}" inputmode="numeric" placeholder="123 ou S/N"></div><div><label for="f-bairro">Bairro</label><input id="f-bairro" data-f="bairro" value="${esc(F.bairro)}" placeholder="Ex.: Centro"></div></div><label for="f-comp">Complemento (opcional)</label><input id="f-comp" data-f="comp" value="${esc(F.comp)}" placeholder="Apto, bloco, casa dos fundos"><label for="f-ref">Ponto de referência</label><input id="f-ref" data-f="ref" value="${esc(F.ref)}" placeholder="Ex.: ao lado da padaria, portão azul"></fieldset>`:''}
<label for="f-pay">Forma de pagamento</label><select id="f-pay" data-act="pay">${S.methods.map((m,i)=>`<option value="${i}" ${i==F.pay?'selected':''}>${esc(m.n)}</option>`).join('')}</select>
${M.t==='pix'?`<div class="pix">Chave Pix${S.pixName?' · '+esc(S.pixName):''}<b>${esc(S.pix)}</b><button data-act="copy">Copiar chave</button><div style="margin-top:8px;font-size:.88rem">Pague o valor total e envie o comprovante no WhatsApp.</div></div>`:''}
${M.t==='link'?(M.link&&M.link.trim().toLowerCase().startsWith('http')?`<div class="pix">Pague com cartão de crédito pelo link seguro e depois envie o pedido.<br><a class="paylink" href="${esc(M.link.trim())}" target="_blank" rel="noopener">Pagar com cartão de crédito</a></div>`:`<div class="pix">Link de pagamento indisponível no momento. Envie o pedido e combinamos pelo WhatsApp.</div>`):''}${M.t==='cash'?`<label for="f-troco">Troco para quanto? (opcional)</label><input id="f-troco" data-f="troco" value="${esc(F.troco)}" inputmode="decimal">`:''}
<label for="f-obs">Observações</label><textarea id="f-obs" data-f="obs" rows="2">${esc(F.obs)}</textarea></div>
<div class="box"><div class="line"><span>Subtotal</span><span>${money(sub())}</span></div><div class="line"><span>Taxa de entrega</span><span>${F.type==='entrega'?money(fee()):'Grátis'}</span></div><div class="line"><span class="total">Total</span><span class="total">${money(tot)}</span></div></div>
<button class="send" data-act="send">Enviar pedido pelo WhatsApp</button>`:'<p class="empty">Seu pedido está vazio. Escolha um item no cardápio.</p>'}`)}

function send(){
if(!F.name.trim()||!F.tel.trim())return toast('Preencha seu nome e telefone.');
if(F.type==='entrega'){const f=[['rua','a rua'],['num','o número da casa'],['bairro','o bairro']].find(([k])=>!F[k].trim());if(f)return toast('Informe '+f[1]+'.')}
const M=S.methods[F.pay]||{n:''};
const L=[`*Novo pedido · ${S.name}*`,'',...cartItems().map(e=>`${cart[e.k]}x ${e.name} — ${money(e.pr*cart[e.k])}`),'',`Subtotal: ${money(sub())}`];
if(F.type==='entrega')L.push(`Taxa de entrega: ${money(fee())}`);
L.push(`*Total: ${money(sub()+fee())}*`,'',`Cliente: ${F.name}`,`Telefone: ${F.tel}`,F.type==='entrega'?`Entrega:\nRua: ${F.rua}, nº ${F.num}\nBairro: ${F.bairro}${F.comp.trim()?`\nComplemento: ${F.comp}`:''}${F.ref.trim()?`\nReferência: ${F.ref}`:''}`:'Retirada no local',`Pagamento: ${M.n}`);
if(M.t==='cash'&&F.troco)L.push(`Troco para: R$ ${F.troco}`);
if(F.obs.trim())L.push(`Obs: ${F.obs}`);
const url='https://wa.me/'+String(S.whats).replace(/\D/g,'')+'?text='+encodeURIComponent(L.join('\n'));
if(!window.open(url,'_blank'))location.href=url}

const fld=(lbl,b,v,extra='')=>`<label>${lbl}</label><input data-b="${b}" value="${esc(v)}" ${extra}>`;
const sw=(b,on)=>`<span class="sw"><input type="checkbox" data-b="${b}" data-chk ${on?'checked':''} aria-label="Disponível"><i></i></span>`;
const dirty=()=>{const e=$('#dirty');if(e)e.hidden=false};
function shrink(f,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const q=Math.min(im.width,im.height),o=Math.min(max,q),c=document.createElement('canvas');c.width=c.height=o;c.getContext('2d').drawImage(im,(im.width-q)/2,(im.height-q)/2,q,q,0,0,o,o);cb(c.toDataURL('image/webp',.86))};im.src=r.result};r.readAsDataURL(f)}

async function save(){if(!isOwner)return toast('Apenas o dono pode publicar.');
const a=window.claude?await claude.use('artifact'):null;
if(!a)return toast('Não foi possível publicar aqui.');
const c=document.documentElement.cloneNode(true);
c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
c.querySelector('#app').innerHTML='';c.querySelector('#layer').innerHTML='';c.querySelector('body').removeAttribute('style');
try{toast('Publicando…');await a.publish('<!DOCTYPE html>\n'+c.outerHTML)}catch(e){toast('Falha ao publicar. Tente de novo.')}}

function setPath(p,v){const k=p.split('.');let o=S;while(k.length>1)o=o[k.shift()];o[k[0]]=v}
function redraw(){sheet==='cart'?cartView():sheet==='admin'?adminView():0;menu();bar()}

document.addEventListener('input',e=>{const t=e.target;if(sheet==='admin')dirty();
if(t.dataset.f)F[t.dataset.f]=t.value;
else if(t.dataset.cat!==undefined){const k=+t.dataset.cat,old=S.cats[k];S.cats[k]=t.value;S.items.forEach(i=>{if(i.c===old)i.c=t.value})}
else if(t.dataset.b&&t.type!=='checkbox'&&t.tagName!=='SELECT')setPath(t.dataset.b,t.dataset.num!==undefined?(parseFloat(String(t.value).replace(',','.'))||0):t.value)});
document.addEventListener('change',e=>{const t=e.target;if(sheet==='admin')dirty();
if(t.dataset.img!==undefined){if(t.files[0])shrink(t.files[0],320,u=>{S.items[+t.dataset.img].img=u;adminView();dirty()})}
else if(t.dataset.bg!==undefined){S.bgs=S.bgs||[];const fs=[...t.files].slice(0,4-S.bgs.length);Promise.all(fs.map(f=>new Promise(r=>shrink(f,640,r)))).then(us=>{S.bgs.push(...us);adminView();shell();dirty()})}
else if(t.dataset.logo!==undefined){if(t.files[0])shrink(t.files[0],900,u=>{S.logo=u;adminView();shell();dirty()})}
else if(t.dataset.act==='pay'){F.pay=+t.value;cartView()}
else if(t.dataset.b&&(t.type==='checkbox'||t.tagName==='SELECT')){setPath(t.dataset.b,t.type==='checkbox'?t.checked:t.value);if(t.dataset.b.startsWith('methods'))adminView()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.tagName==='SELECT')return;const d=t.dataset,k=+d.k;
switch(d.act){
case'inc':if(d.id.startsWith('cg|')&&!cart[d.id]){if(!acaiQty())return toast('Escolha o tamanho do açaí primeiro.');if(optCount()>=maxOpt())return toast('Limite de '+(parseInt(S.acai.max)||6)+' opções por açaí.')}cart[d.id]=d.id.startsWith('cg|')?1:(cart[d.id]||0)+1;redraw();break;
case'dec':cart[d.id]=(cart[d.id]||0)-1;if(cart[d.id]<=0)delete cart[d.id];fitOpts();if(sheet==='cart'&&!count()){redraw();break}redraw();break;
case'cart':sheet='cart';cartView();break;
case'close':closeSheet();shell();break;
case'type':F.type=d.v;cartView();break;
case'copy':navigator.clipboard.writeText(S.pix).then(()=>toast('Chave Pix copiada'),()=>toast('Copie manualmente: '+S.pix));break;
case'send':send();break;
case'owner':isOwner?(sheet='admin',adminView()):toast('Para editar, abra esta página pela sua conta do Claude.');break;
case'admin':if(!isOwner)break;sheet='admin';adminView();break;
case'tab':tab=d.v;adminView();break;
case'additem':openId='i'+Date.now();S.items.push({id:openId,n:'Novo produto',d:'',p:0,c:S.cats[k]||'',e:'🥤',on:true,...(S.items.some(x=>x.c===S.cats[k]&&x.ps)?{ps:S.sizes.map(()=>0)}:{})});adminView();dirty();break;
case'delitem':S.items.splice(k,1);adminView();break;
case'addmethod':S.methods.push({n:'Novo pagamento',t:'card'});adminView();break;
case'delmethod':S.methods.splice(k,1);F.pay=0;adminView();break;
case'addcat':S.cats.push('Nova categoria');adminView();break;
case'delcat':{const o=S.cats.splice(k,1)[0];S.items.forEach(i=>{if(i.c===o)i.c=S.cats[0]||''});adminView();break}
case'mv':{const o=S.items[k],ix=S.items.map((x,j)=>x.c===o.c?j:-1).filter(j=>j>=0),q=ix.indexOf(k)+ +d.d;if(ix[q]!==undefined){const j=ix[q];[S.items[k],S.items[j]]=[S.items[j],S.items[k]];openId=o.id;adminView();dirty()}break}
case'rmbg':S.bgs.splice(k,1);adminView();shell();dirty();break;
case'tgsz':{const i=S.items[k];if(i.ps){i.p=+i.ps[0]||0;delete i.ps}else i.ps=S.sizes.map(()=>+i.p||0);cart={};adminView();dirty();break}
case'addsize':S.sizes.push({n:'Novo'});S.items.forEach(i=>{if(i.ps)i.ps.push(0)});cart={};adminView();dirty();break;
case'delsize':if(S.sizes.length>1){S.sizes.splice(k,1);S.items.forEach(i=>{if(i.ps)i.ps.splice(k,1)});cart={}}adminView();dirty();break;
case'addasz':S.acai.sizes.push({n:'Novo',p:0});adminView();dirty();break;
case'delasz':if(S.acai.sizes.length>1){S.acai.sizes.splice(k,1);cart={}}adminView();dirty();break;
case'addopt':S.acai.groups[k].items.push({n:'Nova opção',p:0,on:true});adminView();dirty();break;
case'delopt':S.acai.groups[k].items.splice(+d.j,1);cart={};adminView();dirty();break;
case'addgrp':S.acai.groups.push({n:'Novo grupo',items:[]});adminView();dirty();break;
case'delgrp':S.acai.groups.splice(k,1);cart={};adminView();dirty();break;
case'rmimg':delete S.items[k].img;adminView();dirty();break;
case'save':save();break}});

shell();
(async()=>{try{const u=window.claude&&await claude.use('user');if(u&&u.isOwner()){isOwner=true;bar()}}catch(e){}})();
</script>


</body></html>
